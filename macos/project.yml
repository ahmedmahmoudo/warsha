# XcodeGen spec for Warsha.xcodeproj, which is generated (and git-ignored): run
# `xcodegen generate --spec macos/project.yml`, or `npm run app:build`, which does it first.
# The same sources also build as a Swift package (Package.swift), for `swift test`.
name: Warsha
options:
  bundleIdPrefix: com.warsha
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
# In Xcode's navigator, though not built: how the app is signed, and its built-in sign-in clients
# (Secrets.xcconfig, git-ignored; build.sh makes it from Secrets.example.xcconfig when missing).
fileGroups:
  - Signing.xcconfig
  - Secrets.xcconfig
  - Secrets.example.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.2
    CURRENT_PROJECT_VERSION: 4
targets:
  Warsha:
    type: application
    platform: macOS
    sources:
      - path: Sources/Warsha
      - path: Resources/Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Warsha
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        WarshaGoogleClientId: $(WARSHA_GOOGLE_CLIENT_ID)
        WarshaGoogleClientSecret: $(WARSHA_GOOGLE_CLIENT_SECRET)
        WarshaGitHubClientId: $(WARSHA_GITHUB_CLIENT_ID)
        WarshaLinearClientId: $(WARSHA_LINEAR_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warsha.app
        PRODUCT_NAME: Warsha
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  WarshaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/WarshaTests
    dependencies:
      - target: Warsha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warsha.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Warsha.app/Contents/MacOS/Warsha
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Warsha:
    build:
      targets:
        Warsha: all
        WarshaTests: [test]
    test:
      targets:
        - WarshaTests
