<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
  <!-- Template image: black + alpha only, macOS tints it. The board's four tiles with glyphs cut out. -->
  <mask id="cut">
    <rect width="18" height="18" fill="#fff"/>
    <g fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- PR -->
      <g stroke-width=".9">
        <circle cx="3" cy="2.9" r=".8"/><circle cx="6" cy="6.1" r=".8"/>
        <path d="M3 3.7v3.4M4.4 2.9h.9a.7.7 0 0 1 .7.7v1.7"/>
      </g>
      <!-- Calendar header -->
      <path d="M9.5 3.6h8"/>
      <!-- Notes -->
      <path d="M11.6 12.3h3.8M11.6 14.9h2.4"/>
    </g>
    <!-- Calendar date, ticket notches -->
    <circle cx="14.9" cy="6.2" r="1" fill="#000"/>
    <circle cx="0.5" cy="13.5" r="1.3" fill="#000"/>
    <circle cx="8.5" cy="13.5" r="1.3" fill="#000"/>
  </mask>
  <g mask="url(#cut)" fill="#000">
    <rect x="0.5" y="0.5" width="8" height="8" rx="2"/>
    <rect x="9.5" y="0.5" width="8" height="8" rx="2"/>
    <rect x="0.5" y="9.5" width="8" height="8" rx="2"/>
    <rect x="9.5" y="9.5" width="8" height="8" rx="2"/>
  </g>
</svg>
